name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev build-essential
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Detect game framework
        run: |
          if grep -Eiq '(^|[[:space:]])import pygame|from pygame' *.py; then
            echo "FRAMEWORK=pygame" >> "$GITHUB_ENV"
          elif grep -Eiq '(^|[[:space:]])import kivy|from kivy' *.py; then
            echo "FRAMEWORK=kivy" >> "$GITHUB_ENV"
          else
            echo "Framework not detected. APK build stopped."
            exit 1
          fi

      - name: Prepare requirements
        run: |
          if [ "$FRAMEWORK" = "pygame" ]; then
            echo "pygame" > requirements.txt
          else
            echo "kivy" > requirements.txt
          fi

      - name: Create Buildozer configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Vyrex
          package.name = vyrex
          package.domain = org.uarnova
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,wav,ogg,json
          version = 0.1.0
          requirements = python3,kivy
          orientation = landscape
          fullscreen = 1
          android.api = 35
          android.minapi = 23
          android.archs = arm64-v8a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          if [ "$FRAMEWORK" = "pygame" ]; then
            sed -i 's/requirements = python3,kivy/requirements = python3,pygame/' buildozer.spec
          fi

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vyrex-Android-APK
          path: bin/*.apk
          if-no-files-found: error
